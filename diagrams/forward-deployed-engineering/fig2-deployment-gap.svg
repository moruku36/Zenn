<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 1562 250" width="1562" height="250" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="pele-title" aria-describedby="pele-desc"><title id="pele-title">導入ギャップと FDE の位置</title><desc id="pele-desc">モデルの能力と業務成果のあいだに、データ連携、業務の暗黙知、評価、権限と監視、組織の定着という導入ギャップがあり、FDE がそこを埋める。現場で得た学びは製品と研究に戻り、次の顧客では標準機能になる。</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_model_gap_0"><path d="M1001.5,161.75L1042.5,161.75"/><path class="pele-marker" d="M1049.5,161.75L1041.5,165.11L1041.5,158.39Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_gap_value_0"><path d="M1277.5,125L1318.5,125"/><path class="pele-marker" d="M1325.5,125L1317.5,128.36L1317.5,121.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_fde_gap_0"><path d="M206.76,117C293.13,117 293.13,88.25 379.5,88.25L1042.5,88.25" stroke-width="2.5"/><path class="pele-marker" d="M1049.5,88.25L1041.5,91.61L1041.5,84.89Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_fde_rnd_0"><path d="M206.76,133C217.38,133 217.38,161.75 228,161.75L372.5,161.75" stroke-dasharray="3 4"/><path class="pele-marker" d="M379.5,161.75L371.5,165.11L371.5,158.39Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_rnd_model_0"><path d="M559.5,161.75L766.5,161.75" stroke-dasharray="3 4"/><path class=