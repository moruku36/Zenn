<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-quadrantChart" viewBox="0 0 500 500" width="500" height="500" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="quadrantChart"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="250" y="22.6">FDE と似た職種の位置関係</tspan></text><g class="pele-quadrants" fill="var(--_s)" stroke="var(--_b)"><g class="pele-quadrant" data-id="1"><rect x="265" y="42" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="378.5" y="64.6" text-anchor="middle">FDE（製品を育てる実装者）</text></g><g class="pele-quadrant" data-id="2"><rect x="34" y="42" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" text-anchor="middle" xml:space="preserve"><tspan x="147.5" y="63.1">受託開発（作り上げるが製品</tspan><tspan x="147.5" y="84.1">には残らない）</tspan></text></g><g class="pele-quadrant" data-id="3"><rect x="34" y="256" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="147.5" y="278.6" text-anchor="middle">コンサル（提案が成果物）</text></g><g class="pele-quadrant" data-id="4"><rect x="265" y="256" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" text-anchor="middle" xml:space="preserve"><tspan x="378.5" y="277.1">営業を支える SE（製品にく</tspan><tspan x="378.5" y="298.1">わしいが実装はし