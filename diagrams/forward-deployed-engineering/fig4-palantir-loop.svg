<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 428 757" width="428" height="757" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="pele-title" aria-describedby="pele-desc"><title id="pele-title">Palantir の FDE と製品開発の循環</title><desc id="pele-desc">FDE が顧客の現場で手早く解決し、製品開発チームがそれを一般化して Foundry や AIP の機能にする。次の顧客ではより速く安く導入でき、ライセンス収入が積み上がる。</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_a_b_0"><path d="M172.87,95L172.87,108C172.87,119 124,119 124,130L124,136"/><path class="pele-marker" d="M124,143L120.64,135L127.36,135Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_b_c_0"><path d="M124,209L124,250"/><path class="pele-marker" d="M124,257L120.64,249L127.36,249Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_c_d_0"><path d="M124,365L124,406"/><path class="pele-marker" d="M124,413L120.64,405L127.36,405Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_d_e_0"><path d="M124,479L124,520"/><path class="pele-marker" d="M124,527L120.64,519L127.36,519Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_e_f_0"><path d="M124,614C124,631.5 172,631.5 172,649L172,655"/><path class="pele-marker" d="M172,662L168.64,654L175.36,654Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_f_a_0"><path d="M296,662L296,649C296,631.5 344,631.5 344,614L344,143C344,125.5 295.13,125.5 295.13,108L295.13,102" stroke-dasharray="3 4"/><path class="pele-marker" d="M295.13,95L298.49,103L291.77,103Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_f_a_0"><rect x="270" y="435.5" width="148" height="21" rx="3" fill="var(--_bg)"/><text x="344" y="450.9" text-anchor="middle">利益を次の現場に投資</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect field" data-id="a" transform="translate(234,51.5)"><rect x="-113.13" y="-43.5" width="226.26" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#fff3d6;stroke:#e0a100;"/><text class="pele-label" style="fill:#5c4200;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">① 顧客の現場に常駐</tspan><tspan x="0" y="5.6">Echo（戦略）＋ Delta（エ</tspan><tspan x="0" y="26.6">ンジニア）</tspan></text></g><g class="pele-node pele-shape-rect field" data-id="b" transform="translate(124,176)"><rect x="-90" y="-33" width="180" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#fff3d6;stroke:#e0a100;"/><text class="pele-label" style="fill:#5c4200;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">② まず素早く解決</tspan><tspan x="0" y="16.1">多少粗くても動かす</tspan></text></g><g class="pele-node pele-shape-rect prod" data-id="c" transform="translate(124,311)"><rect x="-112.86" y="-54" width="225.73" height="108" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#efe7fb;stroke:#7b52c9;"/><text class="pele-label" style="fill:#33205a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">③ 製品開発チームが整え直</tspan><tspan x="0" y="-4.9">す</tspan><tspan x="0" y="16.1">Magritte・Contour・</tspan><tspan x="0" y="37.1">Workshop など</tspan></text></g><g class="pele-node pele-shape-rect prod" data-id="d" transform="translate(124,446)"><rect x="-116" y="-33" width="232" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#efe7fb;stroke:#7b52c9;"/><text class="pele-label" style="fill:#33205a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">④ Foundry / AIP の標準機能</tspan><tspan x="0" y="16.1">に</tspan></text></g><g class="pele-node pele-shape-rect money" data-id="e" transform="translate(124,570.5)"><rect x="-112.86" y="-43.5" width="225.73" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#e5f5ea;stroke:#2e9b57;"/><text class="pele-label" style="fill:#14492a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">⑤ 次の顧客はより速く・安</tspan><tspan x="0" y="5.6">く</tspan><tspan x="0" y="26.6">Bootcamp は数日で稼働</tspan></text></g><g class="pele-node pele-shape-rect money" data-id="f" transform="translate(234,705.5)"><rect x="-114" y="-43.5" width="228" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#e5f5ea;stroke:#2e9b57;"/><text class="pele-label" style="fill:#14492a;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">⑥ 契約が広がる</tspan><tspan x="0" y="5.6">ソフトウェアの利用料が入</tspan><tspan x="0" y="26.6">る</tspan></text></g></g></svg>