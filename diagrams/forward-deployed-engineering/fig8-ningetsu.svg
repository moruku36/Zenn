<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 746 505" width="746" height="505" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="pele-title" aria-describedby="pele-desc"><title id="pele-title">人月受託と FDE 型の違い</title><desc id="pele-desc">人月受託は IT 部門が要件を出し、SIer が多人数で作って納品し、工数で請求する。FDE 型は事業部門や経営層と課題を探し、少人数が AI を使って短いサイクルで作り、固定価格や成果で請求し、定着まで伴走する。</desc><g class="pele-clusters"><g class="pele-cluster" data-id="new"><rect x="470" y="8" width="268" height="489" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="510.22" y="33.6" text-anchor="middle">FDE 型</text></g><g class="pele-cluster" data-id="old"><rect x="8" y="54.5" width="220" height="396" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="78" y="80.1" text-anchor="middle">従来の人月受託</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_o1_o2_0"><path d="M118,142.5L118,183.5"/><path class="pele-marker" d="M118,190.5L114.64,182.5L121.36,182.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_o2_o3_0"><path d="M118,238.5L118,279.5"/><path class="pele-marker" d="M118,286.5L114.64,278.5L121.36,278.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_o3_o4_0"><path d="M118,334.5L118,375.5"/><path class="pele-marker" d="M118,382.5L114.64,374.5L121.36,374.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_n1_n2_0"><path d="M604,114L604,155"/><path class="pele-marker" d="M604,162L600.64,154L607.36,154Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_n2_n3_0"><path d="M604,228L604,269"/><path class="pele-marker" d="M604,276L600.64,268L607.36,268Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_n3_n4_0"><path d="M604,342L604,383"/><path class="pele-marker" d="M604,390L600.64,382L607.36,382Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_old_new_0"><path d="M228,252.5L463,252.5" stroke-width="2.5"/><path class="pele-marker" d="M470,252.5L462,255.86L462,249.14Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_old_new_0"><rect x="250.5" y="234.5" width="190" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="345.5" y="248.4">生成 AI で作る手間が減り</tspan><tspan x="345.5" y="266.4">作業時間で稼ぐ前提が変わる</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect o" data-id="o1" transform="translate(118,118.5)"><rect x="-83.34" y="-24" width="166.67" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#f1f1f1;stroke:#888;"/><text class="pele-label" style="fill:#333;" x="0" y="5.6" text-anchor="middle">IT 部門が要件定義</text></g><g class="pele-node pele-shape-rect o" data-id="o2" transform="translate(118,214.5)"><rect x="-90" y="-24" width="180" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#f1f1f1;stroke:#888;"/><text class="pele-label" style="fill:#333;" x="0" y="5.6" text-anchor="middle">多人数で設計・開発</text></g><g class="pele-node pele-shape-rect o" data-id="o3" transform="translate(118,310.5)"><rect x="-58" y="-24" width="116" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);fill:#f1f1f1;stro