 pele-shape-rect" data-id="e" transform="translate(225.52,464)"><rect x="-108.25" y="-60" width="216.5" height="120" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-30.4">provenance を記録</tspan><tspan x="0" y="-6.4">許可リスト形式と</tspan><tspan x="0" y="17.6">秘密パターンで確認</tspan><tspan x="0" y="41.6">scan-evidence を7日保持</tspan></text></g><g class="pele-node pele-shape-rect" data-id="g" transform="translate(225.52,608)"><rect x="-106" y="-36" width="212" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">evidence gate</tspan><tspan x="0" y="17.6">全部成功しない限り失敗</tspan></text></g></g></svg>
