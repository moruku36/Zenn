<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 753 1096" width="753" height="1096" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:#1f1f1f;--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:sans-serif" fill="#1f1f1f" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="pele-title" aria-describedby="pele-desc"><title id="pele-title">Muse Secure VM の全体構成</title><desc id="pele-desc">利用者のクライアントアプリが、利用者ごとのLinux仮想マシンに接続する。仮想マシンの中は、エージェントが動く実行セルと、安全部品が置かれるホスト側ドメインに分かれる。外への通信とコネクタ操作はすべてホスト側のSentinelを通る。色分けは、青が利用者、緑が実行セル、赤・橙がホスト側の安全部品、紫が外部サービス。</desc><g class="pele-clusters"><g class="pele-cluster" data-id="vm"><rect x="8" y="177" width="737" height="742" fill="#e6e6e6" fill-opacity="0.5" stroke="#8a8a8a" style="rx:4px"/></g><g class="pele-cluster" data-id="host"><rect x="28" y="562" width="697" height="317" fill="#e6e6e6" fill-opacity="0.5" stroke="#8a8a8a" style="rx:4px"/><text class="pele-cluster-label" fill="#6e6e6e" x="154" y="587.6" text-anchor="middle">ホスト側ドメイン（セルの外）</text></g><g class="pele-cluster" data-id="cell"><rect x="248" y="217" width="426.24" height="272" fill="#e6e6e6" fill-opacity="0.5" stroke="#8a8a8a" style="rx:4px"/><text class="pele-cluster-label" fill="#6e6e6e" x="370.02" y="242.6" text-anchor="middle">実行セル（systemd-nspawn）</text></g></g><g class="pele-edges" fill="none" stroke="#1f1f1f" stroke-linecap="round"><g class="pele-edge" data-id="L_user_vm_0"><path d="M376.5,104L376.5,170"/><path class="pele-marker" d="M376.5,177L373.14,169L379.86,169Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_agent_tools_0"><pat