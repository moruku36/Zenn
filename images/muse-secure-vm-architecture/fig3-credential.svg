<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 293 499" width="293" height="499" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:#1f1f1f;--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:sans-serif" fill="#1f1f1f" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="pele-title" aria-describedby="pele-desc"><title id="pele-title">資格情報の代理（Credential Surrogation）の流れ</title><desc id="pele-desc">エージェントは権限を持たない代理トークンだけを扱う。コネクタ操作がSentinelに許可された時点で、hatch-authdが保管する本物の資格情報が送信の直前に差し替えられ、外部サービスへ届く。本物がエージェントのプロセスに入ることはない。色分けは、緑がエージェント、赤がSentinel、橙が資格情報の保管、紫が外部サービス。</desc><g class="pele-edges" fill="none" stroke="#1f1f1f" stroke-linecap="round"><g class="pele-edge" data-id="L_agent_sentinel_0"><path d="M98,80L98,146"/><path class="pele-marker" d="M98,153L94.64,145L101.36,145Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_sentinel_authd_0"><path d="M170.92,225L170.92,291"/><path class="pele-marker" d="M170.92,298L167.56,290L174.28,290Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_authd_svc_0"><path d="M170.92,370L170.92,436"/><path class="pele-marker" d="M170.92,443L167.56,435L174.28,435Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_sentinel_agent_0"><path d="M243.84,153L243.84,87" stroke-dasharray="3 4"/><path class="pele-marker" d="M243.84,80L247.2,88L240.48,88Z" fill="#1f1f1f" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_agent_sentinel_0"><rect x="10" y="106" width="176" height="21" rx="3" fill="#ffffff"/><text x="98" y="121.4" text-anchor="middle">代理トークンで操作を提案</text></g><g class="pele-edge-label" data-id="L_sentinel_authd_0"><rect x="68.92" y="247.5" width="204" height="21" rx="3" fill="#ffffff"/><text x="170.92" y="262.9" text-anchor="middle">許可のときだけ差し替えを依頼</text></g><g class="pele-edge-label" data-id="L_authd_svc_0"><rect x="96.92" y="392.5" width="148" height="21" rx="3" fill="#ffffff"/><text x="170.92" y="407.9" text-anchor="middle">本物を送信直前に挿入</text></g><g class="pele-edge-label" data-id="L_sentinel_agent_0"><rect x="206" y="106" width="75.68" height="21" rx="3" fill="#ffffff"/><text x="243.84" y="121.4" text-anchor="middle">拒否 / 確認</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect cell" data-id="agent" transform="translate(170.92,44)"><rect x="-114" y="-36" width="228" height="72" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#dcfce7;stroke:#16a34a;"/><text class="pele-label" style="fill:#14532d;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">エージェント（実行セル）</tspan><tspan x="0" y="17.6">代理トークンのみ保持</tspan></text></g><g class="pele-node pele-shape-rect sec" data-id="sentinel" transform="translate(170.92,189)"><rect x="-114" y="-36" width="228" height="72" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#fee2e2;stroke:#dc2626;"/><text class="pele-label" style="fill:#7f1d1d;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Sentinel</tspan><tspan x="0" y="17.6">許可・拒否・利用者へ確認</tspan></text></g><g class="pele-node pele-shape-rect host" data-id="authd" transform="translate(170.92,334)"><rect x="-98" y="-36" width="196" height="72" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#ffedd5;stroke:#ea580c;"/><text class="pele-label" style="fill:#7c2d12;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">hatch-authd</tspan><tspan x="0" y="17.6">本物の資格情報を保管</tspan></text></g><g class="pele-node pele-shape-rect ext" data-id="svc" transform="translate(170.92,467)"><rect x="-66" y="-24" width="132" height="48" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#ede9fe;stroke:#7c3aed;"/><text class="pele-label" style="fill:#4c1d95;" x="0" y="5.6" text-anchor="middle">外部サービス</text></g></g></svg>