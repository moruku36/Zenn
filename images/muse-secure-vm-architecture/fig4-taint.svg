<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 449 547" width="449" height="547" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:#1f1f1f;--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:sans-serif" fill="#1f1f1f" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="pele-title" aria-describedby="pele-desc"><title id="pele-title">テイントされた送信（Tainted Egress）の判定</title><desc id="pele-desc">ツール実行は汚染されていない状態から始まる。利用者のデータを読むとカーネルレベルで印が付き、その印はプロセスの派生に伝わる。印のない狭い範囲の通信は自動で許可され得るが、印の付いた通信は自動では通らず、利用者の確認に回る。判定はモデルの自己申告ではなく、eBPFとLSMフックによる実際のデータの流れに基づく。色分けは、緑が汚染されていない状態、赤が汚染された状態と確認への分岐。</desc><g class="pele-edges" fill="none" stroke="#1f1f1f" stroke-linecap="round"><g class="pele-edge" data-id="L_start_read_0"><path d="M232.01,80L232.01,121"/><path class="pele-marker" d="M232.01,128L228.65,120L235.37,120Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_read_clean_0"><path d="M201.93,255.2C201.93,274.85 114,274.85 114,294.5L114,340"/><path class="pele-marker" d="M114,347L110.64,339L117.36,339Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_read_taint_0"><path d="M262.09,255.2C262.09,274.85 350.02,274.85 350.02,294.5L350.02,340"/><path class="pele-marker" d="M350.02,347L346.66,339L353.38,339Z" fill="#1f1f1f" stroke="none"/></g><g class="pele-edge" data-id="L_taint_ask_0"><path d="M350.02,419L350.02,460"/><path class="pele-marker" d="M350.02,467L346.66,459L353.38,459Z" fill="#1f1f1f" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_read_clean_0"><rect x="68" y="296.5" width="92" height="21" rx="3" fill="#ffffff"/><text x="114" y="311.9" text-anchor="middle">読んでいない</text></g><g class="pele-edge-label" data-id="L_read_taint_0"><rect x="325.02" y="296.5" width="50" height="21" rx="3" fill="#ffffff"/><text x="350.02" y="311.9" text-anchor="middle">読んだ</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect clean" data-id="start" transform="translate(232.01,44)"><rect x="-98" y="-36" width="196" height="72" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#dcfce7;stroke:#16a34a;"/><text class="pele-label" style="fill:#14532d;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">ツール実行の開始</tspan><tspan x="0" y="17.6">汚染されていない状態</tspan></text></g><g class="pele-node pele-shape-diam" data-id="read" transform="translate(232.01,201)"><polygon points="0,-73 116.8,0 0,73 -116.8,0" fill="#f3f3f3" stroke="#8a8a8a"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">利用者のデータを</tspan><tspan x="0" y="17.6">読んだか</tspan></text></g><g class="pele-node pele-shape-rect clean" data-id="clean" transform="translate(114,383)"><rect x="-106" y="-36" width="212" height="72" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#dcfce7;stroke:#16a34a;"/><text class="pele-label" style="fill:#14532d;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">汚染されていない通信</tspan><tspan x="0" y="17.6">狭い範囲なら自動許可も</tspan></text></g><g class="pele-node pele-shape-rect taint" data-id="taint" transform="translate(350.02,383)"><rect x="-90.02" y="-36" width="180.03" height="72" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#fee2e2;stroke:#dc2626;"/><text class="pele-label" style="fill:#7f1d1d;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">印が付く（tainted）</tspan><tspan x="0" y="17.6">eBPF / LSMで伝播</tspan></text></g><g class="pele-node pele-shape-rect taint" data-id="ask" transform="translate(350.02,503)"><rect x="-82" y="-36" width="164" height="72" fill="#f3f3f3" stroke="#8a8a8a" style="rx:4px;fill:#fee2e2;stroke:#dc2626;"/><text class="pele-label" style="fill:#7f1d1d;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">自動では通さない</tspan><tspan x="0" y="17.6">利用者の確認へ</tspan></text></g></g></svg>